              url: "https://github.com/JeongMin80"
            - icon: fab fa-instagram
              name: "Instagram"
              url: "https://www.instagram.com/ljmin7239/"
            - icon: fas fa-envelope
              name: "Copy email address"
              action: "copy-email"
              url: "leejeongmin2838@gmail.com"

      about:
        enable: true
        title: "About Me"
        image: ""
        content: |-
          학부연구생으로 활동하며 관련 기술을 익히고 논문을 읽는 과정에서 컴퓨터 비전에 관심을 갖게 되었습니다. 특히 3D Gaussian Splatting(3DGS)과 스타일 전이를 중심으로 공부하고 연구하면서 이 분야를 더 깊이 탐구하고 싶어졌습니다.

          앞으로의 학습 목표는 인공지능을 공부해 지금까지 공부한 3D Editing과 연결해 보는 것입니다. 이를 위해 먼저 딥러닝의 기초를 정리하고 리뷰했던 GaussianEditor처럼 AI 모델을 활용하는 3D 편집 논문을 다시 살펴보며 AI가 편집 과정에서 어떤 역할을 하는지 분석해 보려고 합니다.

          아래 기술들은 논문 리뷰와 함께 논문의 공식 코드를 공부하면서 익혔습니다. 코드를 직접 실행해 결과물을 얻고 그 결과 이미지들을 서로 비교해 보며 각 기술을 실제로 사용해 보았습니다.
        skills:
          enable: true
          title: "학습 과정에서 다뤄본 기술:"
          items:
            - "Python"
            - "PyTorch"
            - "C++"
            - "C"
            - "CUDA"
            - "COLMAP"

      experience:
        enable: true
        title: "Experience"
        items:
          - company: "Holysoft Studios"
            # companyUrl: "https://example.com"
            jobs:
              - name: "게임 개발 인턴"
