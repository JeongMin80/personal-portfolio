                  - 개발 중인 게임 프로젝트를 GitHub에 공개했습니다.

          - company: "VISION INTELLIGENCE LAB (VILab)"
            jobs:
              - name: "학부연구생"
                date: "2026년 3월 - 8월"
                content: |-
                  - 3D Gaussian Splatting(3DGS) 관련 논문을 공부했습니다.
                  - 연구실 세미나에 참여했습니다.
                  - 3D Editing 관련 발표를 진행했습니다.

      education:
        enable: true
        title: "Education"
        index: false
        items:
          - title: "컴퓨터공학부 학부생"
            school:
