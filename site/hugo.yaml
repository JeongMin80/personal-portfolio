      description: "인공지능과 컴퓨터 비전에 관심이 있는 전북대학교 컴퓨터공학부 학생 Jeongmin Lee의 포트폴리오입니다."
      hero:
        enable: true
        intro: "안녕하세요, 저는"
        title: "Jeongmin Lee."
        content: "전북대학교 컴퓨터공학부 3학년에 재학 중이며, 인공지능과 컴퓨터 비전 분야에 관심이 있습니다."
