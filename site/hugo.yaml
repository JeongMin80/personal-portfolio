              url: "https://www.jbnu.ac.kr/web/index.do"
            date: "2022년 - 현재"
            GPA: "3.81 / 4.5"
            content: |-
              **전공 필수 과목**
              - **선형대수학:** 공학, 물리학, 경제학에서 활용되는 선형대수의 이론과 응용을 학습하고, 수학적 사고력과 문제 해결 능력을 컴퓨터공학에 적용하는 방법을 다룹니다.
              - **알고리즘:** 문제를 이해하고 해결 방법을 설계하며, 알고리즘의 효율을 분석하고 새로운 알고리즘을 고안하는 방법을 배웁니다.
              - **데이터베이스:** 대량의 데이터로 데이터베이스를 구축하고 필요한 정보를 효율적으로 검색하는 이론을 학습합니다.
              - **인공지능:** 인간 지능의 여러 영역을 컴퓨터에서 구현하는 기술을 배우고 지능형 프로그램을 개발하는 방법을 다룹니다.
              - **운영체제:** 프로세스, 메모리, 가상 메모리, 입출력 관점에서 운영체제의 기본 원리와 활용 방법을 학습합니다.
          - title: "고등학교"
