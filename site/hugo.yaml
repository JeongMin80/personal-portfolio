baseURL: "https://hugo-profile.netlify.app"
languageCode: "en-us"
title: "Jeongmin Lee | Portfolio"


# Multilingual configuration
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: hobbies
          name: Hobbies
          title: My hobbies
          pageRef: /hobbies
          weight: 1
  ko:
    languageName: "한국어"
    languageCode: "ko-kr"
    weight: 2
    contentDir: "content"
    menu:
      main:
        - identifier: hobbies
          name: Hobbies
          title: My hobbies
          pageRef: /hobbies
          weight: 1
    # Korean homepage copy. Translate only the text below when ready.
    # Shared styles, images, and layout remain in the global params section.
    params:
      hero:
        enable: true
        intro: "Hi, my name is"
        title: "Jeongmin Lee."
        content: "I'm a third-year undergraduate student in the Division of Computer Science and Engineering at Jeonbuk National University, with interests in artificial intelligence and computer vision."
        image: /images/profile.png
        bottomImage:
          enable: true
        # roundImage: true # Make hero image circular | default false
        button:
          enable: true
          name: "Resume"
          url: "files/resume.pdf"
          download: false
          newPage: true
        socialLinks:
          fontAwesomeIcons:
            - icon: fab fa-github
              name: "GitHub"
              url: "https://github.com/JeongMin80"
            - icon: fab fa-instagram
              name: "Instagram"
              url: "https://www.instagram.com/ljmin7239/"
            - icon: fas fa-envelope
              name: "Copy email address"
              action: "copy-email"
              url: "leejeongmin2838@gmail.com"
            - icon: fas fa-blog
              name: "Blog"
              url: "#"

      about:
        enable: true
        title: "About Me"
        image: ""
        content: |-
          I became interested in computer vision while working as an undergraduate researcher, learning relevant techniques and reading research papers. Studying and researching 3D Gaussian Splatting (3DGS) and style transfer has strengthened my interest in exploring the field further.

          I aim to explore a broader range of topics in computer vision and deepen my understanding of artificial intelligence. I hope to use what I learn to understand and solve a variety of problems.
        skills:
          enable: true
          title: "Technologies I've used in my studies:"
          items:
            - "Python"
            - "PyTorch"
            - "C++"
            - "C"
            - "CUDA"
            - "COLMAP"

      experience:
        enable: true
        title: "Experience"
        items:
          - company: "Holysoft Studios"
            # companyUrl: "https://example.com"
            jobs:
              - name: "Game Development Intern"
                date: "Jan 2026"
                content: |-
                  - Learned game development through hands-on practice during an approximately one-month internship in the Philippines.
                  - Developed a personal game based on a self-selected concept.
                  - Published the completed game project on GitHub.

          - company: "VISION INTELLIGENCE LAB (VILab)"
            jobs:
              - name: "Undergraduate Researcher"
                date: "Mar 2026 - Aug 2026"
                content: |-
                  - Studied research papers on 3D Gaussian Splatting (3DGS).
                  - Participated in lab seminars.
                  - Gave a presentation on 3D editing.

      education:
        enable: true
        title: "Education"
        index: false
        items:
          - title: "Undergraduate student, Department of Computer Science"
            school:
              name: "Jeonbuk National University"
              url: "https://www.jbnu.ac.kr/web/index.do"
            date: "2022 - Present"
            GPA: "3.81 out of 4.5"
            content: |-
              **Required Major Courses**
              - **Linear Algebra:** Covers the theory and applications of linear algebra in engineering, physics, and economics, developing mathematical reasoning, problem-solving skills, and the ability to apply these concepts in computer science.
              - **Algorithms:** Studies problem-solving methods and their efficiency as a foundation across computer science applications. Develops the ability to understand problems, design algorithms, analyze their efficiency, and create new algorithms.
              - **Databases:** Covers the theory behind building databases from large volumes of data and retrieving information efficiently.
              - **Artificial Intelligence:** Explores engineering approaches to implementing different aspects of human intelligence on computers and develops the skills needed to build intelligent programs.
              - **Operating Systems:** Develops an understanding of operating system principles and their practical application through process management, memory management, virtual memory, and input/output.
          - title: "High School"
            school:
              name: "Uoosuk High School"
              url: "https://school.jbedu.kr/woosuk/index.do"
            date: "2019 - 2021"

      projects:
        enable: true
        title: "Project & Paper Reviews"
        items:
          - title: "Newton: 2D Penguin Survival Game"
            content: "A 2D survival game built with Unity and C#, where a penguin dodges falling apples and tries to survive as long as possible."
            page: "/projects/newton/"
            image: "/images/projects/newton.png"
            imageText: "Newton"
            featured:
              name: Demo
              link: "https://jeongmin80.github.io/unity-game/"
            badges:
              - "Unity"
              - "C#"
              - "WebGL"
            links:
              - icon: fab fa-github
                name: "Game GitHub repository"
                url: "https://github.com/JeongMin80/unity-game"

          - title: "3D Gaussian Splatting (3DGS)"
            content: "A paper review of 3D Gaussian Splatting for real-time novel-view synthesis."
            page: "/paper-reviews/3dgs/"
            image: "/images/projects/3dgs.png"
            imageText: "3DGS"
            badges:
              - "Paper Review"
              - "3DGS"
              - "Computer Vision"
            links:
              - icon: fab fa-github
                name: "Official GitHub repository"
                url: "https://github.com/graphdeco-inria/gaussian-splatting"
              - icon: fas fa-file-pdf
                name: "arXiv paper"
                url: "https://arxiv.org/abs/2308.04079"

          - title: "GaussianEditor"
            content: "A paper review of swift and controllable 3D editing with Gaussian Splatting."
            page: "/paper-reviews/gaussianeditor/"
            image: "/images/projects/gaussianeditor.png"
            imageText: "GaussianEditor"
            badges:
              - "Paper Review"
              - "3D Editing"
              - "Gaussian Splatting"
            links:
              - icon: fab fa-github
                name: "Official GitHub repository"
                url: "https://github.com/buaacyw/GaussianEditor"
              - icon: fas fa-file-pdf
                name: "arXiv paper"
                url: "https://arxiv.org/abs/2311.14521"

      terms:
        read: "Read"
        toc: "Table Of Contents"
        copyright: "All rights reserved"
        emailText: "Check out this site"

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

